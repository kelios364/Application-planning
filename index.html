<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Semaine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <div class="app-container">
    <header>
      <div class="header-top">
        <button id="fullscreenBtn" class="icon-head-btn" title="Plein écran">⛶</button>
        <h1>PLANNING SEMAINE</h1>
        <button id="settingsBtn" class="icon-head-btn" title="Réglages">⚙️</button>
      </div>

      <div class="view-toggle">
        <button id="btnList" class="toggle-btn active">Vue Liste</button>
        <button id="btnGrid" class="toggle-btn">Vue Grille</button>
      </div>
    </header>

    <!-- Vue Liste -->
    <main class="week-grid" id="weekGrid"></main>

    <!-- Vue Grille / Emploi du temps -->
    <main class="timetable-wrapper hidden" id="timetableView">
      <table class="timetable">
        <thead id="timetableHeader"></thead>
        <tbody id="timetableBody"></tbody>
      </table>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
