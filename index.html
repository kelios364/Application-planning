<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Semaine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme">

  <header>
    <div class="header-top">
      <button id="fullscreenBtn" class="icon-head-btn" title="Plein écran">⛶</button>
      <h1>Planning Semaine</h1>
      <button id="settingsBtn" class="icon-head-btn" title="Réglages">⚙️</button>
    </div>
    <div class="view-toggle">
      <button id="btnList" class="toggle-btn active">Vue Liste</button>
      <button id="btnGrid" class="toggle-btn">Vue Grille</button>
    </div>
  </header>

  <!-- Vue Liste -->
  <main class="week-grid" id="weekGrid"></main>

  <!-- Vue Grille Horaire Corrigée -->
  <main class="timetable-wrapper hidden" id="timetableView">
    <table class="timetable">
      <thead id="timetableHeader">
        <!-- Généré en JS -->
      </thead>
      <tbody id="timetableBody">
        <!-- Généré en JS -->
      </tbody>
    </table>
  </main>

  <!-- Modal Nouvelle Tâche -->
  <div class="modal" id="taskModal">
    <div class="modal-content">
      <h2>Nouvelle tâche</h2>
      <form id="taskForm">
        <input type="hidden" id="selectedDay">
        
        <label for="taskText">Tâche :</label>
        <input type="text" id="taskText" required placeholder="Ex: Faire du sport">

        <label>Icône :</label>
        <div class="icon-selector" id="iconSelector">
          <button type="button" class="icon-btn active" data-icon="📌">📌</button>
          <button type="button" class="icon-btn" data-icon="🏃">🏃</button>
          <button type="button" class="icon-btn" data-icon="💼">💼</button>
          <button type="button" class="icon-btn" data-icon="📚">📚</button>
          <button type="button" class="icon-btn" data-icon="🛒">🛒</button>
          <button type="button" class="icon-btn" data-icon="🧹">🧹</button>
          <button type="button" class="icon-btn" data-icon="🍳">🍳</button>
          <button type="button" class="icon-btn" data-icon="🎮">🎮</button>
        </div>

        <label for="startTime">Heure de début (optionnel) :</label>
        <input type="time" id="startTime">

        <label for="duration">Durée en minutes (optionnel) :</label>
        <input type="number" id="duration" min="5" step="5" placeholder="Ex: 45">

        <div class="modal-actions">
          <button type="button" class="btn btn-cancel" id="cancelBtn">Annuler</button>
          <button type="submit" class="btn btn-save">Ajouter</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Réglages -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2>Réglages</h2>
      <div class="settings-options">
        <button id="themeToggleBtn" class="settings-btn">Passer au Mode Clair</button>
        <button id="resetWeekBtn" class="settings-btn btn-danger">Réinitialiser la semaine</button>
      </div>
      <div class="modal-actions" style="margin-top: 20px;">
        <button type="button" class="btn btn-cancel" id="closeSettingsBtn">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal Confirmation Réinitialisation -->
  <div class="modal" id="confirmModal">
    <div class="modal-content">
      <h2>Confirmation</h2>
      <p style="margin-bottom: 20px;">Es-tu sûr de vouloir réinitialiser toutes les tâches de la semaine ?</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="confirmNoBtn">Non</button>
        <button type="button" class="btn btn-save" id="confirmYesBtn">Oui</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
